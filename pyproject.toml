[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gladiator-agent"
version = "0.1.0a1"
description = "Telegram-first, context-efficient coding agent built on mini-swe-agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GladiatorAgent contributors" }]
dependencies = [
  "mini-swe-agent>=2.0.0",
  "httpx>=0.27",
  "platformdirs>=4.3",
  "pydantic>=2.8",
  "rich>=13.9",
  "typer>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["browser-use"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
gladiator = "gladiator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gladiator"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
