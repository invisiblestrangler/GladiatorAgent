name: Live E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: E2E scenario to run
        required: true
        default: core
        type: choice
        options:
          - core
          - image

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    environment: env
    timeout-minutes: 15
    env:
      E2E_API_KEY: ${{ secrets.OPENROUTER_KEY }}
      GLADIATOR_TG_BOT: ${{ secrets.GLADIATOR_TG_BOT }}
      TG_USER_ID: ${{ secrets.TG_USER_ID }}
      E2E_BASE_URL: https://openrouter.ai/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install Gladiator
        run: uv sync --extra dev
      - name: Run core live E2E
        if: ${{ inputs.mode == 'core' }}
        env:
          E2E_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
        run: uv run python scripts/e2e_live.py
      - name: Install image test dependency
        if: ${{ inputs.mode == 'image' }}
        run: uv pip install pillow
      - name: Wait for Telegram image and run multimodal E2E
        if: ${{ inputs.mode == 'image' }}
        env:
          E2E_MODEL: dots-studio/dots-3-note-preview:free
        run: uv run python scripts/e2e_image_interactive.py
